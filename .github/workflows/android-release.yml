name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare web assets (1.6.3)
        run: |
          mkdir -p app/src/main/assets/www
          git show 13182afbc681815ffbaa694d9d1d22e3e6aae4cc:index.html > /tmp/base.html
          python3 << 'PY'
          from pathlib import Path
          t = Path("/tmp/base.html").read_text(encoding="utf-8")
          t = t.replace('const VER="1.6.2"', 'const VER="1.6.3"')
          t = t.replace('const KEY="boshra_preview_162"', 'const KEY="boshra_preview_163"')
          t = t.replace('(a.type==="exam"?"آزمون":"کلاسی")', '(a.type==="exam"?"آزمون":a.type==="cont"?"مستمر":"کلاسی")')
          old_modal = '''if(ui.modal==="as") return '<div class="modal"><div class="card"><h2>ارزیابی جدید</h2><input id="atitle" placeholder="عنوان"/><select id="atype" style="margin-top:8px"><option value="class">نمره کلاسی</option><option value="exam">آزمون</option></select><select id="amax" style="margin-top:8px"><option value="5">سقف ۵</option><option value="10">سقف ۱۰</option><option value="20" selected>سقف ۲۰</option><option value="40">سقف ۴۰</option></select><p class="muted">معادل از ۲۰ = نمره ÷ سقف × ۲۰</p><button class="btn" id="asave">ذخیره</button><button class="btn ghost" id="aclose" style="margin-top:8px">بستن</button></div></div>';'''
          new_modal = '''if(ui.modal==="as") return '<div class="modal"><div class="card"><h2>ارزیابی جدید</h2><input id="atitle" placeholder="عنوان (مثلاً پرسش کلاسی ۱)"/><select id="atype" style="margin-top:8px"><option value="class">نمره کلاسی</option><option value="cont">مستمر</option><option value="exam">آزمون</option></select><select id="amax" style="margin-top:8px"><option value="5">از ۵</option><option value="10">از ۱۰</option><option value="20" selected>از ۲۰</option></select><p class="muted">معادل‌سازی خودکار: نمره ÷ سقف × ۲۰ — نمره پایانی از میانگین مستمر و آزمون محاسبه می‌شود.</p><button class="btn" id="asave">ذخیره</button><button class="btn ghost" id="aclose" style="margin-top:8px">بستن</button></div></div>';'''
          if old_modal not in t:
              raise SystemExit("modal pattern missing in base")
          t = t.replace(old_modal, new_modal)
          t = t.replace('هر تعداد ستون کلاسی یا آزمون اضافه کنید.', 'ستون کلاسی / مستمر / آزمون با سقف ۵، ۱۰ یا ۲۰ اضافه کنید. معادل از ۲۰ خودکار است.')
          t = t.replace(
              '''field("توکن",'<input id="tok" type="password" dir="ltr" value="'+esc(db.settings.eitaaToken)+'"/>')+''',
              '''field("توکن API ایتا (از پنل eitaayar)",'<input id="tok" type="password" dir="ltr" value="'+esc(db.settings.eitaaToken)+'" placeholder="botXXXX:xxxxxxxx-xxxx-..."/>')+'''
          )
          t = t.replace(
              ''''<button class="btn" id="se">ذخیره ایتا</button></div>'+''',
              ''''<button class="btn" id="se">ذخیره ایتا</button><p class="muted" style="margin-top:8px">توکن فقط در ادمین ذخیره می‌شود و در APK/گیت‌هاب قرار نمی‌گیرد. از پنل eitaayar.ir توکن API خود را کپی کنید. برای تست: eitaayar.ir/testApi</p></div>'+'''
          )
          Path("app/src/main/assets/www/index.html").write_text(t, encoding="utf-8")
          print("patched", len(t))
          assert 'const VER="1.6.3"' in t
          assert 'value="cont"' in t
          assert 'از ۵' in t
          PY
          ls -la app/src/main/assets/www/
          grep -n 'const VER' app/src/main/assets/www/index.html | head -1
          wc -c app/src/main/assets/www/index.html

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "STORE_FILE=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/boshra-ci.jks" \
              -alias boshra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass boshra123456 -keypass boshra123456 \
              -dname "CN=School App, OU=Edu, O=School, L=Tehran, C=IR"
            echo "STORE_FILE=$GITHUB_WORKSPACE/boshra-ci.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=boshra123456" >> $GITHUB_ENV
            echo "KEY_ALIAS=boshra" >> $GITHUB_ENV
            echo "KEY_PASSWORD=boshra123456" >> $GITHUB_ENV
          fi

      - name: Build signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "$GITHUB_WORKSPACE/Boshra-School-v1.6.3-release.apk"
          ls -lh "$GITHUB_WORKSPACE/Boshra-School-v1.6.3-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boshra-1.6.3-apk
          path: Boshra-School-v1.6.3-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.3
          name: مدیریت کلاس بشری ۱.۶.۳
          body: |
            نسخه ۱.۶.۳
            - ارزیابی: کلاسی / مستمر / آزمون با سقف ۵، ۱۰ یا ۲۰
            - معادل‌سازی خودکار از ۲۰
            - نمره پایانی خودکار (میانگین مستمر و آزمون)
            - توکن ایتا فقط در ادمین (از پنل eitaayar — در APK ذخیره نمی‌شود)
            - بقیه امکانات ۱.۶.۲
          files: Boshra-School-v1.6.3-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
