name: Android Release Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare web assets
        run: |
          mkdir -p app/src/main/assets/www
          cp -f index.html p0.b64 p1.b64 p2.b64 p3.b64 app/src/main/assets/www/
          ls -la app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "STORE_FILE=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/boshra-ci.jks" \
              -alias boshra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass boshra123456 -keypass boshra123456 \
              -dname "CN=School App, OU=Edu, O=School, L=Tehran, C=IR"
            echo "STORE_FILE=$GITHUB_WORKSPACE/boshra-ci.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=boshra123456" >> $GITHUB_ENV
            echo "KEY_ALIAS=boshra" >> $GITHUB_ENV
            echo "KEY_PASSWORD=boshra123456" >> $GITHUB_ENV
          fi

      - name: Build signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "$GITHUB_WORKSPACE/Boshra-School-v1.6.2-release.apk"
          ls -lh "$GITHUB_WORKSPACE/Boshra-School-v1.6.2-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boshra-1.6.2-apk
          path: Boshra-School-v1.6.2-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.6.2
          name: مدیریت کلاس بشری ۱.۶.۲
          body: |
            نسخه ۱.۶.۲ نهایی
            - غایبین هر کلاس در خانه
            - حضور سبز/قرمز + توضیح
            - پیام ایتا با انتخاب پایه/کلاس/دانش‌آموز
            - آپلود لوگو و عکس دانش‌آموز
            - آدرس سرور + سرور محلی
            - safe-area و اسکرول کیبورد
          files: Boshra-School-v1.6.2-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
