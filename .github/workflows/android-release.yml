name: Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret missing — building unsigned release artifacts only"
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
          else
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            if [ "$HAS_KEYSTORE" = "true" ]; then
              ./gradlew assembleRelease \
                -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.jks \
                -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
                -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
                -Pandroid.injected.signing.key.password=$KEY_PASSWORD
            else
              ./gradlew assembleRelease
            fi
          else
            echo "Gradle wrapper not found. Add full Android Gradle project to enable APK build."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: boshra-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            */build/outputs/apk/release/*.apk
          if-no-files-found: warn
