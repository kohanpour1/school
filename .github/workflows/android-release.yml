name: Android Release Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Generate Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Decode circular launcher icons (optional)
        run: |
          python3 << 'PY'
          import base64, pathlib
          mapping = {
            "icons/ic_mdpi.b64": "app/src/main/res/mipmap-mdpi/ic_launcher.png",
            "icons/ic_hdpi.b64": "app/src/main/res/mipmap-hdpi/ic_launcher.png",
            "icons/ic_xhdpi.b64": "app/src/main/res/mipmap-xhdpi/ic_launcher.png",
          }
          any_ok=False
          for src, dst in mapping.items():
            p = pathlib.Path(src)
            if not p.exists():
              continue
            try:
              data=base64.b64decode(p.read_text().strip())
              if len(data)<100: continue
              out=pathlib.Path(dst)
              out.parent.mkdir(parents=True, exist_ok=True)
              out.write_bytes(data)
              out.with_name("ic_launcher_round.png").write_bytes(data)
              any_ok=True
              print("ok", dst, len(data))
            except Exception as e:
              print("skip", src, e)
          print("icons_done", any_ok)
          PY

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "STORE_FILE=$GITHUB_WORKSPACE/release.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=$KEYSTORE_PASSWORD" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$GITHUB_WORKSPACE/boshra-ci.jks" \
              -alias boshra -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass boshra123456 -keypass boshra123456 \
              -dname "CN=Boshra School, OU=Edu, O=Boshra, L=Tehran, C=IR"
            echo "STORE_FILE=$GITHUB_WORKSPACE/boshra-ci.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=boshra123456" >> $GITHUB_ENV
            echo "KEY_ALIAS=boshra" >> $GITHUB_ENV
            echo "KEY_PASSWORD=boshra123456" >> $GITHUB_ENV
          fi

      - name: Build signed Release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$STORE_FILE" \
            -Pandroid.injected.signing.store.password="$STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          if ls app/build/outputs/apk/release/*-unsigned.apk 1>/dev/null 2>&1; then
            echo "ERROR: unsigned APK"
            exit 1
          fi
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$APK" "$GITHUB_WORKSPACE/boshra-school-release.apk"
          ls -lh "$GITHUB_WORKSPACE/boshra-school-release.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: boshra-release-apk
          path: boshra-school-release.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0-${{ github.run_number }}
          name: بشری ${{ github.run_number }}
          body: |
            APK امضادار سامانه بشری v1.1
            فونت وزیرمتن · نقش‌ها · دانش‌آموز/حضور/نمره/پیام/خروجی CSV · آیکون دایره‌ای
          files: boshra-school-release.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
