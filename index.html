<!DOCTYPE html>
<html lang="fa" dir="rtl"><head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#5B2C8A"/>
<title>مدیریت کلاس بشری</title>
</head><body>
<div id="boot" style="font-family:Tahoma;text-align:center;padding:48px;color:#5B2C8A">بارگذاری نسخه ۱.۶.۲…</div>
<script>
(async function(){
  try{
    const parts = await Promise.all([0,1,2,3].map(i=>fetch('p'+i+'.b64').then(r=>r.text())));
    const b64 = parts.map(s=>s.trim()).join('');
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open(); document.write(html); document.close();
  }catch(e){
    document.getElementById('boot').textContent='خطا: '+(e&&e.message?e.message:e);
  }
})();
</script>
</body></html>
