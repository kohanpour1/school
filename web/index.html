<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#5B2C8A"/>
<title>سامانه بشری</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Vazirmatn,Arial,sans-serif}
html,body{margin:0;padding:0;min-height:100%;min-height:100dvh;background:linear-gradient(165deg,#f8f5fc 0%,#efe8f7 50%,#f3eef9 100%);color:#1f1235}
#app{min-height:100%;padding-bottom:var(--kb,0px);transition:padding-bottom .2s}
.card{background:#fff;border-radius:1.1rem;box-shadow:0 6px 24px rgba(91,44,138,.09);border:1px solid #ebe0f5}
.btn-p{background:linear-gradient(135deg,#5B2C8A,#7d3fad);color:#fff;border:0;cursor:pointer}
.btn-d{background:#fee2e2;color:#b91c1c;border:0;cursor:pointer}
.btn-g{background:#dcfce7;color:#166534;border:0;cursor:pointer}
input,select,textarea{border:1.5px solid #d4b8eb;border-radius:.75rem;padding:.85rem 1rem;width:100%;font-size:1rem;background:#fff;outline:none}
.inp-lg{min-height:3.25rem}
input:focus,textarea:focus,select:focus{scroll-margin:120px}
th{background:#5B2C8A;color:#fff;padding:.65rem .45rem;font-size:.82rem}
td{padding:.6rem .45rem;border-bottom:1px solid #f0e8f7;text-align:center;font-size:.88rem}
table{width:100%;border-collapse:collapse}
.logo{border-radius:50%;background:linear-gradient(145deg,#5B2C8A,#8E44AD);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;object-fit:cover}
img.logo{background:transparent!important;padding:0;border:0}
.toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:300;padding:.85rem 1.35rem;border-radius:.9rem;color:#fff;max-width:92vw;font-size:.92rem;display:none}
.toast.show{display:block}
.modal-bg{background:rgba(42,20,64,.55)}
.hidden{display:none!important}
.tab-on{border-bottom:3px solid #fff;font-weight:700}
.hdr{padding-top:1.15rem;padding-bottom:.85rem}
.hdr-title{font-size:1.08rem;line-height:1.55;font-weight:700;margin-top:.2rem}
.hdr-sub{font-size:.8rem;opacity:.92;margin-top:.2rem}
.nav-btn{padding:.75rem .9rem;font-size:.88rem;white-space:nowrap;background:transparent;border:0;color:rgba(255,255,255,.9);cursor:pointer}
.gap-form{display:flex;flex-direction:column;gap:.9rem}
label.lbl{font-size:.82rem;color:#5B2C8A;font-weight:600;margin-bottom:.25rem;display:block}
.bg-brand-600{background:#5B2C8A}
.text-brand-700{color:#4a2470}
.text-gray-500{color:#6b7280}
.font-bold{font-weight:700}
.font-extrabold{font-weight:800}
.text-xs{font-size:.75rem}
.text-sm{font-size:.875rem}
.text-base{font-size:1rem}
.text-xl{font-size:1.25rem}
.p-4{padding:1rem}.p-7{padding:1.75rem}
.px-3{padding-left:.75rem;padding-right:.75rem}
.py-3{padding-top:.75rem;padding-bottom:.75rem}
.mb-3{margin-bottom:.75rem}.mb-6{margin-bottom:1.5rem}
.mt-2{margin-top:.5rem}
.rounded-xl{border-radius:.75rem}
.w-full{width:100%}
.max-w-md{max-width:28rem}.max-w-3xl{max-width:48rem}
.mx-auto{margin-left:auto;margin-right:auto}
.flex{display:flex}.grid{display:grid}
.grid-cols-2{grid-template-columns:1fr 1fr}
.gap-2{gap:.5rem}.gap-3{gap:.75rem}
.items-center{align-items:center}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.flex-1{flex:1}
.min-h-screen{min-height:100vh}
.text-center{text-align:center}
</style>
</head>
<body>
<div id="app"><div style="padding:2rem;text-align:center;color:#5B2C8A">در حال بارگذاری...</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
