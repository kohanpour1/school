<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#5B2C8A"/>
<title>سامانه بشری</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}html,body{margin:0;min-height:100%;background:#f5f0fa;color:#1f1235}
.card{background:#fff;border-radius:1rem;box-shadow:0 4px 16px rgba(91,44,138,.08);border:1px solid #ebe0f5;padding:1rem;margin-bottom:.75rem}
.btn{border:0;border-radius:.75rem;padding:.85rem 1rem;font-weight:700;cursor:pointer;font-size:.95rem}
.bp{background:linear-gradient(135deg,#5B2C8A,#7d3fad);color:#fff}.bd{background:#fee2e2;color:#b91c1c}.bg{background:#dcfce7;color:#166534}
input,select,textarea{width:100%;border:1.5px solid #d4b8eb;border-radius:.7rem;padding:.85rem;font-size:1rem;margin-bottom:.6rem}
label{display:block;font-size:.8rem;color:#5B2C8A;font-weight:600;margin-bottom:.2rem}
.logo{width:72px;height:72px;border-radius:50%;background:linear-gradient(145deg,#5B2C8A,#8E44AD);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:800;margin:0 auto 12px}
header{background:#5B2C8A;color:#fff;position:sticky;top:0;z-index:20}
header .top{padding:1rem .9rem .7rem;display:flex;justify-content:space-between;align-items:flex-start}
header .nav{display:flex;overflow-x:auto;border-top:1px solid rgba(255,255,255,.15)}
header .nav button{background:0;border:0;color:rgba(255,255,255,.9);padding:.7rem .85rem;white-space:nowrap;font-size:.85rem}
header .nav button.on{border-bottom:3px solid #fff;font-weight:700;background:rgba(255,255,255,.12)}
main{max-width:48rem;margin:0 auto;padding:.9rem;padding-bottom:5rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.stat{text-align:center}.stat b{display:block;font-size:1.5rem;color:#5B2C8A}
table{width:100%;border-collapse:collapse;font-size:.85rem}th{background:#5B2C8A;color:#fff;padding:.5rem}td{padding:.5rem;border-bottom:1px solid #f0e8f7;text-align:center}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#5B2C8A;color:#fff;padding:.75rem 1.2rem;border-radius:.8rem;display:none;z-index:99}
.toast.show{display:block}.modal{position:fixed;inset:0;background:rgba(40,15,60,.5);display:flex;align-items:center;justify-content:center;padding:1rem;z-index:50}
.modal>div{background:#fff;border-radius:1rem;padding:1.1rem;width:100%;max-width:24rem;max-height:90vh;overflow:auto}
.row{display:flex;gap:.5rem}.row>*{flex:1}.hide{display:none!important}.muted{color:#6b7280;font-size:.8rem}
</style>
</head>
<body>
<div id="app"><div style="padding:2rem;text-align:center;color:#5B2C8A">بارگذاری...</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
<script src="app.features.js"></script>
</body>
</html>
