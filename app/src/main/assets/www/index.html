<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"/>
<meta name="theme-color" content="#5B2C8A"/>
<title>سامانه بشری</title>
<style>
*{box-sizing:border-box;font-family:Tahoma,Vazirmatn,Arial,sans-serif}
html,body{margin:0;padding:0;min-height:100%;min-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:linear-gradient(165deg,#f8f5fc 0%,#efe8f7 50%,#f3eef9 100%);color:#1f1235}
#app{min-height:100dvh;padding-bottom:24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120%);background:#5B2C8A;color:#fff;padding:.7rem 1.2rem;border-radius:999px;z-index:9999;opacity:0;transition:.25s;font-size:.9rem}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app"><div style="padding:2rem;text-align:center;color:#5B2C8A">در حال بارگذاری...</div></div>
<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
